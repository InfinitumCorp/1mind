<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1MIND</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/i18n/i18n.css">
<script type="module" src="/i18n/start.js"></script>
</head>
<body>
<div class="classbar">INFINITUM CORPORATION // INTERNAL // RESTRICTED</div>
<header class="topbar">
  <a class="brand" href="#overview"><b>1</b>MIND<span></span></a>
  <span class="stat-pill" id="owner"><span class="dot"></span>—</span>
  <span class="stat-pill hide-sm" id="conjure-pill"><span class="dot"></span>CONJURE</span>
  <span class="stat-pill hide-sm" id="jobs-pill"><span class="dot"></span>0 JOBS</span>
  <span class="spacer"></span>
  <span class="stat-pill hide-sm" id="clock">—</span>
  <button class="iconbtn" id="theme">◐ THEME</button>
  <div class="cid-bar" data-cumulus-bar data-create="false"></div>
</header>
<div class="shell">
  <nav class="rail" id="rail">
    <div class="sect">COMMAND</div>
    <a href="#overview" data-v="overview">◉ OVERVIEW <span class="k">1</span></a>
    <a href="#products" data-v="products">▦ PRODUCTS <span class="k">2</span></a>
    <a href="#pipeline" data-v="pipeline">⇉ PIPELINE <span class="k">3</span></a>
    <div class="sect">OPERATIONS</div>
    <a href="#redteam" data-v="redteam">◬ RED TEAM <span class="k">4</span></a>
    <a href="#conjure" data-v="conjure">✦ CONJURE <span class="k">5</span></a>
    <a href="#openclaw" data-v="openclaw">⟁ OPENCLAW <span class="k">6</span></a>
    <div class="sect">RECORD</div>
    <a href="#jobs" data-v="jobs">≡ JOBS <span class="k">7</span></a>
    <a href="#audit" data-v="audit">⌘ AUDIT <span class="k">8</span></a>
    <div class="foot">1MIND v0.1<br>127.0.0.1 ONLY<br>ALL ACTIONS AUDITED</div>
  </nav>
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer"></aside>
<div class="graph-tip" id="tip"></div>
<!-- The Cumulus://ID account bar: a copy of https://id.cumuluscloud.app/id/bar.js (the CSP allows
     scripts from this origin only). 1MIND keeps its own server session, so the bar's sign-in and
     sign-out go to /auth/cid/start and /logout, and app.js tells it who is signed in. -->
<script src="/cumulus-bar.js" data-client="1mind" data-signin="/auth/cid/start" data-signout="/logout" defer></script>
<script src="/app.js" type="module"></script>
</body>
</html>
