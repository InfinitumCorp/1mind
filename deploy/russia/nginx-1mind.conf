# 1MIND on conjure-russia (Yandex Cloud). DNS-only records (no Cloudflare proxy) so the
# hosts load in Russia without a VPN and everywhere else. Certificates: Let's Encrypt
# webroot (/var/www/acme), same as conjure-ru.

limit_req_zone $binary_remote_addr zone=onemind_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=onemind_api:10m rate=20r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 1mind-ru.infinitumcorporation.ai;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/1mind-ru.infinitumcorporation.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1mind-ru.infinitumcorporation.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 2M;

    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    location /auth/ {
        limit_req zone=onemind_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4400;
        include /etc/nginx/snippets/1mind-proxy.conf;
    }
    location / {
        limit_req zone=onemind_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4400;
        include /etc/nginx/snippets/1mind-proxy.conf;
    }
}

# Conjure deliverables: a separate origin so generated code can't call the 1MIND API.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 1mind-ru-preview.infinitumcorporation.ai;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/1mind-ru.infinitumcorporation.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1mind-ru.infinitumcorporation.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4401;
        include /etc/nginx/snippets/1mind-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 1mind-ru.infinitumcorporation.ai 1mind-ru-preview.infinitumcorporation.ai;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
